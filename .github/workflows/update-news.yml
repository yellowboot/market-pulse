name: Update news feed

on:
  schedule:
    # Weekdays: every ~90 min during the NYSE/Nasdaq session (9:30am-4pm ET).
    # UTC times below target EDT (UTC-4); during EST (UTC-5, roughly
    # Nov-Mar) actual market open/close is an hour later than these times —
    # GitHub Actions cron is fixed-UTC and doesn't shift for DST.
    - cron: '30 13 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    # Weekends: markets are closed, once a day is enough.
    - cron: '0 15 * * 0,6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh news
        env:
          # Read from an encrypted repo secret only — never logged, never
          # committed. If the secret isn't set, fetch_news.py silently
          # falls back to the local keyword heuristic.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated news_data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.js
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update news feed [skip ci]"
            git push
          fi
