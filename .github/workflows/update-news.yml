name: Update news feed

on:
  schedule:
    # Weekdays: once an hour during broad market hours (06:00-22:00 UTC —
    # covers European open through the US close).
    - cron: '0 6-22 * * 1-5'
    # Weekends: twice a day is plenty, markets are closed.
    - cron: '0 8,20 * * 0,6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh news
        env:
          # Read from an encrypted repo secret only — never logged, never
          # committed. If the secret isn't set, fetch_news.py silently
          # falls back to the local keyword heuristic.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated news_data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.js
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "Auto-update news feed [skip ci]"
            git push
          fi
